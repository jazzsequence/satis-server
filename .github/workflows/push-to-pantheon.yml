name: Deploy to Pantheon

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - README.md

permissions:
  contents: write
  deployments: write
  statuses: write

jobs:
  deploy:
    name: Push to Pantheon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure Pantheon Host Key
        run: |
          echo "Host *.drush.in HostKeyAlgorithms +ssh-rsa" >> ~/.ssh/config
          echo "Host *.drush.in PubkeyAcceptedKeyTypes +ssh-rsa" >> ~/.ssh/config
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Configure Composer Auth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CLEAN="$(printf '%s' "$GITHUB_TOKEN" | tr -d '[:space:]')"
          # DEBUG: reveal token SHAPE only (alnum -> x, cat -A shows newlines as $). No secret leaks.
          echo "== raw github.token shape ==";  printf '%s' "$GITHUB_TOKEN" | sed 's/[A-Za-z0-9]/x/g' | cat -A
          echo "== cleaned shape ==";           printf '%s' "$CLEAN"        | sed 's/[A-Za-z0-9]/x/g' | cat -A
          # Remove any existing entry (setup-php may have written a newlined one) then set the cleaned token.
          composer config -g --unset github-oauth.github.com 2>/dev/null || true
          composer config -g github-oauth.github.com "$CLEAN"
          echo "== stored github-oauth shape =="; composer config -g github-oauth.github.com | sed 's/[A-Za-z0-9]/x/g' | cat -A
          HOME_DIR="$(composer config -g home)"; echo "COMPOSER_HOME: $HOME_DIR"
          for f in "$HOME_DIR/auth.json" "$HOME_DIR/config.json"; do
            echo "== $f =="; [ -f "$f" ] && sed 's/[A-Za-z0-9]/x/g' "$f" | cat -A || echo "(absent)"
          done

      - name: Composer dependencies
        run: composer install

      - name: Push to Pantheon
        uses: pantheon-systems/push-to-pantheon@0.9.2
        id: deploy
        with:
          ssh_key: ${{ secrets.SSH_KEY }}
          site: ${{ secrets.SITE_ID }}
          machine_token: ${{ secrets.TERMINUS_TOKEN }}
          target_env: dev
          git_commit_message: 🤖 Automated Build Assets - beep boop
  test:
    name: Playwright Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D playwright @playwright/test
          npx playwright install

      - name: Run Playwright test
        env:
          BASE_URL: https://${{ secrets.SATIS_URL }}
        run: npx playwright test "${{ github.workspace }}/.github/tests/postDeploy.spec.ts"
